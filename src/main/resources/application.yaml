server:
  # Define a porta em que o servidor web embutido (Tomcat) irá rodar.
  port: 8080
  # Define um caminho de contexto base para todos os endpoints da API.
  # Ex: http://localhost:8080/api/v1/users
  servlet:
    context-path: /api/v1

# Define um nome lógico para a aplicação.
spring:
  profiles:
    # Define o perfil ativo (dev, prod, etc.)
    active: dev
  application:
    name: penelope-api-rest
  # Configurações do Jackson (para manipulação de JSON)
  jackson:
    serialization:
      # Formata a data para um padrão legível (ISO 8601)
      write-dates-as-timestamps: false
    # Não falha se encontrar uma propriedade desconhecida no JSON
    deserialization:
      fail-on-unknown-properties: false

# Habilita o Swagger UI
springdoc:
  swagger-ui:
    enabled: true
    # Altera o caminho para a documentação, se desejar (opcional)
    path: /swagger-ui/index.html
    # Configurações de exibição do Swagger UI
    docExpansion: none
    operationsSorter: method

  # Define o título da sua API (opcional, mas recomendado)
  api-docs:
    enabled: true
    path: /api-docs