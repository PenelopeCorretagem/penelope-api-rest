spring:
  datasource:
    url: jdbc:h2:mem:penelopec;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        highlight_sql: true
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: false
    clean-disabled: false

  rabbitmq:
    # Em dev, exige docker-compose up para o RabbitMQ.
    # Para rodar sem broker, comente o bloco spring.rabbitmq no application.yaml.
    connection-timeout: 5000ms

logging:
  level:
    penelope.corretagem.penelopeapirest: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
    org.springframework.security: DEBUG
  file:
    name: logs/dev.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"