# Configurações do Servidor para Desenvolvimento
server:
  # Usar uma porta diferente para não conflitar com outros serviços
  port: 8081
  tomcat:
    max-http-form-post-size: 20MB


spring:
  datasource:
    # URL do banco H2 em memória
    url: jdbc:mysql://localhost:3306/penelopec?useSSL=false&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    # Mostra o SQL gerado pelo Hibernate no console
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        # Formata o SQL para melhor legibilidade
        format_sql: true
    hibernate:
      # Cria e destrói o esquema do banco a cada inicialização (útil para testes)
      ddl-auto: create-drop
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    # Nível de log DEBUG para o nosso pacote, para ver mais detalhes
    penelope.corretagem.penelopeapirest: DEBUG
    # Nível de log DEBUG para o Hibernate, para ver detalhes das operações com o banco
    org.hibernate: DEBUG

  file:
    name: logs/dev.log

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

api:
  security:
    token:
      secret: ${JWT_API_KEY}

app:
  frontend:
    url: http://localhost:8080

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
